[package]
name = "tauri-plugin-atomic-diffusion"
version = "0.6.599"
authors = ["Atomic Chat <service@atomic.chat>"]
description = "Tauri plugin that supervises a local stable-diffusion.cpp server and owns the image gallery"
license = "MIT"
repository = "https://github.com/AtomicBot-ai/Atomic-Chat"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-atomic-diffusion"

[dependencies]
base64 = "0.22"
crc32fast = "1.4"
# Only the PNG codec is in the workspace lockfile (pulled in by tauri's
# `image-png`); thumbnails are therefore PNG, not WebP.
image = { version = "0.25", default-features = false, features = ["png"] }
jan-utils = { path = "../../utils" }
log = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5.0", default-features = false, features = [] }
thiserror = "2.0.12"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.7", features = ["v4"] }

# Desktop-only, like the audio plugin: the plugin is never registered on mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "native-tls",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["signal", "process"] }

[dev-dependencies]
png = "0.18"
tempfile = "3.0"

[build-dependencies]
tauri-plugin = { version = "2.3.1", features = ["build"] }
