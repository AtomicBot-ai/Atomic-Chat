name: Windows Test Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-test-build.yml'
      - 'src-tauri/**'
      - 'web-app/**'
      - 'core/**'
      - 'extensions/**'
      - 'scripts/**'
      - 'package.json'
      - 'yarn.lock'
  push:
    branches:
      - main
      - feature/atomic-code-foundation
    paths:
      - '.github/workflows/windows-test-build.yml'
      - 'src-tauri/**'
      - 'web-app/**'
      - 'core/**'
      - 'extensions/**'
      - 'scripts/**'
      - 'package.json'
      - 'yarn.lock'

permissions:
  # The build no longer pushes version tags — every build's number comes from
  # the workflow run number — so read access is enough.
  contents: read

jobs:
  build-windows-test:
    name: Build unsigned Windows installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          # v5 would otherwise cache Yarn from package.json's packageManager
          # before corepack has activated Yarn 4 below; the Cache Yarn step
          # already does this.
          package-manager-cache: false

      # Every test build a user downloads gets its own version number (tracker
      # D34). The number is the workflow run number: it increments once per run,
      # repo-wide for this workflow, so two builds can never share a number and
      # nobody has to bump anything by hand. This replaces the old refuse-a-
      # reused-number gate, which forced a manual `make bump-version` on every
      # branch and collided whenever main was merged in.
      - name: Stamp this build with a version number
        id: version
        shell: bash
        run: |
          version="2.0.${{ github.run_number }}"
          node scripts/set-build-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Radium $version"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Yarn
        uses: actions/cache@v5
        with:
          path: .yarn/cache
          key: yarn-windows-test-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-windows-test-

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Configure Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false

      - name: Install dependencies and build core/extensions
        shell: pwsh
        run: |
          yarn install
          yarn build:tauri:plugin:api
          yarn build:core
          yarn build:extensions

      - name: Download bundled helper binaries
        shell: pwsh
        run: yarn download:bin

      - name: Download upstream llama.cpp CPU backend
        shell: bash
        run: |
          set -euo pipefail
          DIR="src-tauri/resources/llamacpp-backend-upstream"
          rm -rf "$DIR"
          mkdir -p "$DIR"

          RESOLVED="$(node scripts/resolve-upstream-backend.mjs --backend win-cpu-x64)"
          eval "$RESOLVED"

          echo "$TAG" > "$DIR/version.txt"
          echo "$BACKEND" > "$DIR/backend.txt"
          echo "Release: $TAG  Backend: $BACKEND"
          echo "Downloading: $URL"

          curl -fSL --retry 5 --retry-delay 3 "$URL" -o /tmp/llamacpp-upstream-backend.zip
          if [ -n "$SHA256" ]; then
            ACTUAL="$(sha256sum /tmp/llamacpp-upstream-backend.zip | cut -d' ' -f1)"
            if [ "$ACTUAL" != "$SHA256" ]; then
              echo "Error: sha256 mismatch for $ASSET (expected $SHA256, got $ACTUAL)"
              exit 1
            fi
          fi

          unzip -o /tmp/llamacpp-upstream-backend.zip -d "$DIR"
          rm -f /tmp/llamacpp-upstream-backend.zip

          if [ ! -f "$DIR/build/bin/llama-server.exe" ] && [ -f "$DIR/llama-server.exe" ]; then
            mkdir -p "$DIR/build/bin"
            find "$DIR" -maxdepth 1 -type f ! -name version.txt ! -name backend.txt -exec mv {} "$DIR/build/bin/" \;
          fi

          test -f "$DIR/build/bin/llama-server.exe"

      - name: Download TurboQuant llama.cpp CPU backend
        shell: bash
        run: |
          set -euo pipefail
          DIR="src-tauri/resources/llamacpp-backend"
          BACKEND="windows-x64-cpu"
          rm -rf "$DIR"
          mkdir -p "$DIR"

          RESOLVED="$(./scripts/resolve-turboquant-release.sh "$BACKEND" "${TURBOQUANT_TAG:-}")"
          TAG="${RESOLVED%% *}"
          ASSET="${RESOLVED#* }"
          URL="https://github.com/AtomicBot-ai/atomic-llama-cpp-turboquant/releases/download/${TAG}/${ASSET}"

          echo "$TAG" > "$DIR/version.txt"
          echo "$BACKEND" > "$DIR/backend.txt"
          echo "Release: $TAG  Backend: $BACKEND"
          echo "Downloading: $URL"

          curl -fSL --retry 5 --retry-delay 3 "$URL" -o /tmp/llamacpp-turboquant-backend.zip
          unzip -o /tmp/llamacpp-turboquant-backend.zip -d "$DIR"
          rm -f /tmp/llamacpp-turboquant-backend.zip

          if [ ! -f "$DIR/build/bin/llama-server.exe" ] && [ -f "$DIR/llama-server.exe" ]; then
            mkdir -p "$DIR/build/bin"
            find "$DIR" -maxdepth 1 -type f ! -name version.txt ! -name backend.txt -exec mv {} "$DIR/build/bin/" \;
          fi

          test -f "$DIR/build/bin/llama-server.exe"

      # Without this the test installer ships no llama.cpp backend at all.
      # The Windows bundle takes `resources/backend-packages/`, which only this
      # script writes - the two download steps above land in
      # `resources/llamacpp-backend*/`, which `tauri.windows.conf.json` does not
      # bundle. `release.yml` has always staged these; the test build never did,
      # so its installers looked complete and were not.
      #
      # Same manifest as the release job on purpose: it carries verified sizes
      # and sha256s, so a test installer offers the same offline backends a real
      # one does rather than a second set nobody checks.
      - name: Restore verified Windows backend archive cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\atomic-backend-cache
          key: windows-backend-bundle-${{ hashFiles('scripts/windows-backend-bundle.json') }}

      - name: Stage verified offline Windows backend archives
        env:
          ATOMIC_BACKEND_CACHE_DIR: ${{ runner.temp }}\atomic-backend-cache
        run: node scripts/stage-windows-backends.mjs

      - name: Build web app and icons
        shell: pwsh
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          yarn build:web
          yarn build:icon
          yarn copy:assets:tauri

      - name: Build CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/bin | Out-Null
          Push-Location src-tauri
          cargo build --release --features cli --bin jan-cli
          Copy-Item target/release/jan-cli.exe resources/bin/jan-cli.exe -Force
          Pop-Location

      - name: Build unsigned Windows app
        shell: pwsh
        env:
          NODE_OPTIONS: '--max-old-space-size=4196'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn tauri build

      - name: Show produced bundles
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'src-tauri/target/release/bundle') {
            Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -File | Select-Object FullName, Length
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: radium-windows-test-${{ steps.version.outputs.version }}-${{ github.sha }}
          # NSIS only. Both installers embed the whole ~1.26GB offline backend
          # bundle, so shipping the MSI as well doubled the download for a file
          # nobody installs from when testing. The MSI is still built and still
          # listed by the step above, so a regression in it is still visible.
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
