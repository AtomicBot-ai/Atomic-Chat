name: msstore

# The Microsoft Store installs Atomic Chat (an "EXE or MSI app") from a URL we host: the Store downloads the
# installer from it on every install, so it must answer without a redirect (GitHub release assets redirect,
# and Partner Center refuses them), keep serving the same bytes while a submission points at it, and carry the
# version in its path. release.yml uploads Atomic.Chat_<version>_x64_msstore.exe to every draft; when a person
# publishes the release (`release: published`, which `make release-prod` does) the upload job copies it to its
# own public object in the atomic-chat-downloads bucket on Hetzner Object Storage, and the submit job
# (scripts/msstore-submit.mjs) points the Partner Center product at that URL, rewrites "What's new" from the
# release notes and submits it for certification. By hand:
#
#   gh workflow run msstore.yml --ref vX.Y.Z                    # on the tag: the environment admits tags only
#   gh workflow run msstore.yml --ref vX.Y.Z -f store=dry-run   # show what the submission would change
#   gh workflow run msstore.yml --ref vX.Y.Z -f force=true      # resubmit a version the Store already has
#   gh workflow run msstore.yml --ref <tag with this file> -f tag=vX.Y.Z   # a release tagged before it existed
#
# The submission waits for nothing: while an earlier one is still in certification it changes nothing and says
# so (the API cannot cancel it), and the next publish, or `make release-prod X.Y.Z` again, takes the newest
# version. Setting the repository variable MSSTORE_SUBMIT to "off" keeps the upload and skips the Store.
# Store API credentials (MSSTORE_TENANT_ID, MSSTORE_CLIENT_ID, MSSTORE_CLIENT_SECRET, MSSTORE_SELLER_ID) live in
# the packages environment; without them the submit job warns and skips. Pre-releases and drafts change
# nothing. An uploaded installer is never replaced or deleted: the live submission keeps installing from its URL
# until a newer one goes live.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The published release (vX.Y.Z); default: the tag this runs on'
        type: string
        required: false
      store:
        description: 'Microsoft Store submission after the upload'
        type: choice
        options: [submit, dry-run, skip]
        default: submit
      force:
        description: 'Resubmit even when the Store already points at this version'
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  upload:
    runs-on: ubuntu-latest
    # The same Hetzner project as the apt/dnf repository; its S3 credentials cover every bucket in it.
    environment: packages
    concurrency:
      group: msstore-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      cancel-in-progress: false
    outputs:
      upload: ${{ steps.release.outputs.upload }}
      url: ${{ steps.release.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      BUCKET: atomic-chat-downloads
      BASE_URL: https://atomic-chat-downloads.fsn1.your-objectstorage.com
      AWS_ENDPOINT_URL: https://fsn1.your-objectstorage.com
      AWS_DEFAULT_REGION: fsn1
      # Newer aws CLIs add checksums by default that not every S3-compatible store accepts.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Resolve the release and its Store installer
        id: release
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::notice::$TAG is not a stable vX.Y.Z tag"; echo "upload=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          version="${BASH_REMATCH[1]}"
          name="Atomic.Chat_${version}_x64_msstore.exe"
          info="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq "\"\(.isDraft) \(.isPrerelease) \([.assets[].name | select(. == \"$name\")] | length)\"")"
          read -r draft prerelease found <<< "$info"
          if [ "$draft" = true ]; then
            echo "::notice::$TAG is a draft"; echo "upload=false" >> "$GITHUB_OUTPUT"; exit 0
          elif [ "$prerelease" = true ]; then
            echo "::notice::$TAG is a pre-release"; echo "upload=false" >> "$GITHUB_OUTPUT"; exit 0
          elif [ "$found" = 0 ]; then
            # Tag builds always bundle it (release.yml, build-windows): a published release without it
            # has nothing the Store can install.
            echo "::error::$TAG has no $name"; exit 1
          fi
          {
            echo "upload=true"
            echo "name=$name"
            echo "key=msstore/$version/$name"
            echo "url=$BASE_URL/msstore/$version/$name"
          } >> "$GITHUB_OUTPUT"

      - name: Download it
        if: steps.release.outputs.upload == 'true'
        env:
          NAME: ${{ steps.release.outputs.name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir dl
          echo "SHA256=$(sha256sum "dl/$NAME" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c %s "dl/$NAME")" >> "$GITHUB_ENV"

      - name: Upload it, unless the same bytes are already there
        if: steps.release.outputs.upload == 'true'
        env:
          NAME: ${{ steps.release.outputs.name }}
          KEY: ${{ steps.release.outputs.key }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if existing="$(aws s3api head-object --bucket "$BUCKET" --key "$KEY" \
                --query 'Metadata.sha256' --output text 2>/dev/null)"; then
            if [ "$existing" = "$SHA256" ]; then
              echo "::notice::$KEY is already uploaded"; exit 0
            fi
            echo "::error::$KEY holds other bytes (sha256 $existing); a Store submission may install from it, so it is not replaced"
            exit 1
          fi
          # The bucket stays private (no listing, no anonymous writes); the object alone is public.
          aws s3 cp "dl/$NAME" "s3://$BUCKET/$KEY" --only-show-errors \
            --acl public-read \
            --content-type application/octet-stream \
            --cache-control 'public, max-age=31536000, immutable' \
            --metadata "sha256=$SHA256"

      - name: Check the public URL serves it without a redirect
        if: steps.release.outputs.upload == 'true'
        env:
          KEY: ${{ steps.release.outputs.key }}
        run: |
          set -euo pipefail
          url="$BASE_URL/$KEY"
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-redirs 0 -I "$url")"
          if [ "$status" != 200 ]; then echo "::error::$url answers $status, not 200"; exit 1; fi
          served="$(curl -sSf --max-redirs 0 "$url" | sha256sum | cut -d' ' -f1)"
          if [ "$served" != "$SHA256" ]; then
            echo "::error::$url serves sha256 $served, the release asset is $SHA256"; exit 1
          fi
          {
            echo "### Microsoft Store installer for $TAG"
            echo
            echo "Partner Center > Packages > Package URL:"
            echo
            echo '```'
            echo "$url"
            echo '```'
            echo
            echo "- size: $SIZE bytes"
            echo "- sha256: \`$SHA256\`"
            echo "- architecture x64, installer parameters \`/S\`, app type EXE"
          } >> "$GITHUB_STEP_SUMMARY"

  submit:
    needs: upload
    if: needs.upload.outputs.upload == 'true' && vars.MSSTORE_SUBMIT != 'off' && inputs.store != 'skip'
    runs-on: ubuntu-latest
    environment: packages
    timeout-minutes: 45
    # One Store product: never two submissions at once, whatever the tag.
    concurrency:
      group: msstore-submit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/msstore-submit.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Fetch the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"

      - name: Submit it to the Microsoft Store
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          # Partner Center > Apps and games > Atomic Chat (the EXE product).
          MSSTORE_PRODUCT_ID: ef7bb39a-01d5-4579-a0c2-01187b78e596
          PACKAGE_URL: ${{ needs.upload.outputs.url }}
          STORE_MODE: ${{ inputs.store }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(--tag "$TAG" --package-url "$PACKAGE_URL" --notes-file "$RUNNER_TEMP/notes.md"
                --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG")
          if [ "$STORE_MODE" = dry-run ]; then args+=(--dry-run); fi
          if [ "$FORCE" = true ]; then args+=(--force); fi
          node scripts/msstore-submit.mjs "${args[@]}"
