# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # super-linter reports each linter's outcome as a commit status. Without
      # this the run still lints, but every status POST fails with a 403.
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # textlint's terminology preset cannot tell prose from identifiers or
          # from quoted document titles, so it rejects "id", "api" and "ids"
          # wherever they appear. Markdown style is covered by markdownlint
          # (.github/linters/.markdownlint.json).
          VALIDATE_NATURAL_LANGUAGE: false
          # ts-standard runs against super-linter's own bundled tsconfig
          # (/action/lib/.automation/tsconfig.json), which includes none of this
          # repository's files, so it cannot parse any of them:
          #   Parsing error: ESLint was configured to run on <file> using
          #   parserOptions.project: .../action/lib/.automation/tsconfig.json
          #   However, that TSConfig does not include this file.
          # It also enforces standardjs style, which contradicts this
          # repository's Prettier configuration. TYPESCRIPT_ES (eslint) passes
          # and stays on; TypeScript is gated properly by `make verify`.
          VALIDATE_TYPESCRIPT_STANDARD: false
