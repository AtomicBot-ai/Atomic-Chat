name: linux-repo

# The apt/dnf repository (scripts/linux-repo.mjs) and the AUR package atomic-chat-bin follow published
# releases. release.yml leaves a draft with the deb and rpm packages (linux-packages); this runs when a
# person publishes it (`release: published`), or by hand for a tag:
#
#   gh workflow run linux-repo.yml --ref vX.Y.Z    # on the tag: the environment admits tags only
#
# Pre-releases, drafts and releases without packages change nothing. The repository is rebuilt from the
# newest stable releases that carry packages (REPOSITORY_KEEP) whichever one triggered it, so any run
# converges on the same state. Ported from AtomicBot-ai/eye-cli, which runs the `atc` repository this way.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The published release (vX.Y.Z); default: the tag this runs on'
        type: string
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Resolve the release and whether it goes into the repository
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          publish=false
          info="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq '"\(.isDraft) \(.isPrerelease) \([.assets[].name | select(test("^atomic-chat_.+\\.(deb|rpm)$"))] | length)"')"
          read -r draft prerelease packages <<< "$info"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::notice::$TAG is not a stable vX.Y.Z tag"
          elif [ "$draft" = true ]; then echo "::notice::$TAG is a draft"
          elif [ "$prerelease" = true ]; then echo "::notice::$TAG is a pre-release"
          elif [ "$packages" = 0 ]; then echo "::notice::$TAG has no Linux packages"
          else publish=true
          fi
          { echo "tag=$TAG"; echo "version=${TAG#v}"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

  # The apt/dnf repository: rebuilt from scratch out of the newest stable releases (this one now among
  # them, so after publish: the repository lists public assets only), signed, mirrored to its public
  # bucket on Hetzner Object Storage (REPOSITORY in scripts/linux-packaging.mjs).
  # Nothing to repair after a failure: re-running the job rebuilds the same repository.
  repo:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: packages
    # Two releases published close together must not mirror over each other.
    concurrency:
      group: linux-repo
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install the repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c >/dev/null
      - name: Import the packages key (must be packaging/atomic-chat.asc)
        env:
          KEY: ${{ secrets.LINUX_PACKAGES_GPG_KEY }}
        run: |
          set -euo pipefail
          expected="$(gpg --show-keys --with-colons packaging/atomic-chat.asc | awk -F: '/^fpr:/ {print $10; exit}')"
          printf '%s\n' "$KEY" | gpg --batch --import
          if ! gpg --list-secret-keys "$expected" >/dev/null 2>&1; then
            echo "::error::LINUX_PACKAGES_GPG_KEY is not the key in packaging/atomic-chat.asc"; exit 1
          fi
          echo "PACKAGES_KEY=$expected" >> "$GITHUB_ENV"
      - name: Fetch the packages of the newest releases, checked against GitHub's sha256
        run: node scripts/linux-repo.mjs fetch --out dl
      - name: Build the repository
        env:
          LINUX_PACKAGES_GPG_PASSPHRASE: ${{ secrets.LINUX_PACKAGES_GPG_PASSPHRASE }}
        run: node scripts/linux-repo.mjs build --assets dl --key "$PACKAGES_KEY" --out site
      - name: Mirror it to the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
        run: node scripts/linux-repo.mjs sync --site site

  # The live repository, the way README.md tells users to add it: catches what the loopback smoke in
  # release.yml cannot (the domain, the cache, the published key).
  smoke-repo:
    needs: [release, repo]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, image: 'debian:13', manager: apt }
          - { runner: ubuntu-latest, image: 'fedora:44', manager: dnf }
          - { runner: ubuntu-24.04-arm, image: 'debian:13', manager: apt }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
      IMAGE: ${{ matrix.image }}
      MANAGER: ${{ matrix.manager }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install from the published repository and check
        run: |
          set -euo pipefail
          node scripts/linux-repo.mjs readme --block "$MANAGER" > install-commands.sh
          docker run --rm -v "$PWD:/w:ro" "$IMAGE" \
            sh /w/scripts/smoke-linux-package.sh "$MANAGER" "$VERSION" /w/install-commands.sh

  # atomic-chat-bin on the AUR: the PKGBUILD downloads this release's debs. Only the latest release goes
  # there (publishing an older one later must not downgrade it), and a re-run finds the AUR already at
  # this version and does nothing.
  aur:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: packages
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Skip unless this is the latest release and the AUR does not have it yet
        id: aur
        run: |
          set -euo pipefail
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::$TAG is not the latest release ($latest); the AUR stays as it is"
            echo "push=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          current="$(curl -fsSL --globoff 'https://aur.archlinux.org/rpc/v5/info?arg[]=atomic-chat-bin' | jq -r '.results[0].Version // ""')"
          want="$(node --input-type=module -e "
            import { archPkgver } from './scripts/linux-packaging.mjs'
            console.log(archPkgver(process.env.VERSION) + '-1')")"
          echo "the AUR has '$current'; this release is $want"
          if [ "$current" = "$want" ]; then echo "push=false" >> "$GITHUB_OUTPUT"; else echo "push=true" >> "$GITHUB_OUTPUT"; fi
      - name: Render the PKGBUILD for the published release
        if: steps.aur.outputs.push == 'true'
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'atomic-chat_*.deb' --dir release
          node scripts/linux-packages.mjs pkgbuild --version "$VERSION" --assets release --out aur
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        if: steps.aur.outputs.push == 'true'
        with:
          pkgname: atomic-chat-bin
          pkgbuild: aur/PKGBUILD
          assets: aur/atomic-chat-bin.install
          commit_username: Atomic Chat
          commit_email: support@atomic.chat
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Atomic Chat ${{ needs.release.outputs.version }}
          # Builds the package from the PKGBUILD (downloads, checksums, package()) before pushing.
          test: true
          # The action stages every file when assets are supplied. Do not commit makepkg's
          # downloaded deb or built package: AUR rejects large blobs.
          post_process: rm -f -- atomic-chat-*.deb atomic-chat-bin-*.pkg.tar.*
