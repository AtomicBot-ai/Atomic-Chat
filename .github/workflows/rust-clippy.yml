# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# rust-clippy is a tool that runs a bunch of lints to catch common
# mistakes in your Rust code and help improve your Rust code.
# More details at https://github.com/rust-lang/rust-clippy
# and https://rust-lang.github.io/rust-clippy/

name: rust-clippy analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '27 0 * * 1'

permissions:
  contents: read

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            pkg-config \
            unzip

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #@v4
        with:
          node-version: "20"

      - name: Prepare repository resources
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          # Extension lockfiles reference the core archive built in this job.
          # Its generated hash must refresh after rebuilding shared contracts.
          yarn config set -H enableImmutableInstalls false
          make install-and-build
          make stub-resources app-icons

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 #@stable
        with:
          components: clippy

      - name: Install required cargo
        run: cargo install clippy-sarif sarif-fmt

      - name: Run rust-clippy
        env:
          TAURI_CONFIG: '{"bundle":{"icon":["icons/icon.png"]}}'
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --no-default-features --features test-tauri --message-format=json -- -D warnings > rust-clippy.json
          clippy-sarif < rust-clippy.json > rust-clippy-results.sarif
          sarif-fmt < rust-clippy-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d #@v4.38.3
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true
