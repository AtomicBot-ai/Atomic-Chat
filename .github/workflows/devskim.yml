# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 15 * * 2'

permissions:
  contents: read

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #@v7.0.1

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 #@v1
        with:
          # DS173237 ("a token or key was found") cannot tell a hardcoded
          # secret from a SHA-256 checksum or content fingerprint, and this
          # repository is full of the latter: model-download checksums in
          # core/media, backend-bundle hashes, and the bundled skills' own
          # data-file fingerprints and Google Fonts commit ids. Every DS173237
          # hit here has been reviewed as a checksum, not a secret. Real secret
          # detection is covered by gitleaks (super-linter) and CodeQL; leaving
          # DS173237 on only produced noise that failed the code-scanning check.
          exclude-rules: DS173237
          # src-tauri/resources/agent-skills/ is third-party skill content
          # bundled verbatim (Anthropic, NVIDIA, UI UX Pro Max): example
          # scripts, templates and eval helpers that Radium ships as data and
          # never executes itself. Its findings (seeded random for eval splits,
          # localhost in test helpers, CDN scripts in templates) are not ours
          # to fix in vendored code, so the tree is excluded like it is from
          # super-linter. The first two globs are the action's defaults, kept.
          ignore-globs: "**/.git/**,**/bin/**,**/src-tauri/resources/agent-skills/**"

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d #@v4.38.3
        with:
          sarif_file: devskim-results.sarif
