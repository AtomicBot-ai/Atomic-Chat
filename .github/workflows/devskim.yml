# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 15 * * 2'

permissions:
  contents: read

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #@v4

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 #@v1
        with:
          # DS173237 ("a token or key was found") cannot tell a hardcoded
          # secret from a SHA-256 checksum or content fingerprint, and this
          # repository is full of the latter: model-download checksums in
          # core/media, backend-bundle hashes, and the bundled skills' own
          # data-file fingerprints and Google Fonts commit ids. Every DS173237
          # hit here has been reviewed as a checksum, not a secret. Real secret
          # detection is covered by gitleaks (super-linter) and CodeQL; leaving
          # DS173237 on only produced noise that failed the code-scanning check.
          exclude-rules: DS173237

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 #@v3
        with:
          sarif_file: devskim-results.sarif
