version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm — every directory that holds a package.json manifest or lockfile.
  # Yarn workspaces are listed at their root (where the lockfile lives) and
  # also per-member so no manifest is left unmonitored.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
      security:
        update-types: ["security"]

